name: CI
'on':
  push:
    branches:
      - main
  pull_request: null
  workflow_dispatch:
    inputs:
      cpu-scope:
        description: CPU qualification scope
        type: choice
        options:
          - all
          - capture
        default: all
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  rust-runtime:
    name: Rust ${{ matrix.lane }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        lane:
          - contracts
          - lints
          - aot-performance
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Verify parser semantics and operation costs
        if: matrix.lane == 'contracts'
        uses: leanprover/lean-action@f061402b660e0c34644504b324e830f2991d4865 # v1
        with:
          lake-package-directory: formal
          auto-config: false
          build: true
          test: false
          lint: false
          use-mathlib-cache: false
      - name: Set up uv
        if: matrix.lane == 'contracts'
        uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.11.3'
      - name: Verify publication model and evidence host controls
        if: matrix.lane == 'contracts'
        run: |
          npm ci --ignore-scripts --prefix formal/quint
          npm --prefix formal/quint test
          uv run --project formal/evidence --locked python -m unittest discover -s formal/evidence -k HostControls -v
          uv run --project formal/evidence --locked python -m unittest discover -s formal/evidence -p test_model_inputs.py -v
      - name: Identify Rust toolchain
        id: rust-version
        run: echo "version=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Restore Rust build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            target
            t/fixtures/runtime-record-assignments/target
            t/fixtures/runtime-ascii-digit-run/target
          key: parser-rust-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.lane }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
      - name: Verify Rust formatting
        run: cargo fmt --all -- --check
        if: matrix.lane == 'contracts'
      - name: Verify Rust contracts
        run: cargo test --workspace --all-features --locked
        if: matrix.lane == 'contracts'
      - name: Verify record assignments Cargo consumer
        run: cargo test --locked --manifest-path t/fixtures/runtime-record-assignments/Cargo.toml
        if: matrix.lane == 'contracts'
      - name: Verify external ASCII digit adapter
        run: |
          cargo fmt --manifest-path t/fixtures/runtime-ascii-digit-run/Cargo.toml -- --check
          cargo test --locked --manifest-path t/fixtures/runtime-ascii-digit-run/Cargo.toml
        if: matrix.lane == 'contracts'
      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
        if: matrix.lane == 'lints'
      - name: Verify publishable Rust products
        run: cargo package -p gerbil-parser-artifact -p gerbil-parser-runtime --locked --allow-dirty
        if: matrix.lane == 'lints'
      - name: Verify generated-table AOT engine red zones
        run: cargo test --release -p gerbil-parser-build-support --test performance_test -- --ignored --nocapture --test-threads=1
        if: matrix.lane == 'aot-performance'
  scheme:
    name: Scheme ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gerbil-label: release-v0.19-2591dcd
            release-os: linux
            release-arch: x86_64
            release-tag: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-linux-x86_64-portable-full-single-host-unlimited-patchf5cedd8168cb
            release-sha256: 9844ba362fdf6f1c5e8a4411e462a466d52dee0d541f8e84f61091cec0e5e740
          - os: macos-latest
            gerbil-label: release-v0.19-2591dcd
            release-os: darwin
            release-arch: aarch64
            release-tag: gerbil-v0.19-2591dcd9b7c6d2c4e9dd8611a17c5b1a5d82bbdb-darwin-aarch64-gcc16-arm64-aot-tools-single-host-unlimited-patchf5cedd8168cb
            release-sha256: 8d9c88434aed6301eaebb719bf52472f05c2368eafc630e8a9f1d67cc9895a21
    uses: ./.github/workflows/scheme.yml
    with:
      os: ${{ matrix.os }}
      gerbil-label: ${{ matrix.gerbil-label }}
      cpu-scope: ${{ inputs.cpu-scope || 'all' }}
      release-os: ${{ matrix.release-os }}
      release-arch: ${{ matrix.release-arch }}
      release-tag: ${{ matrix.release-tag }}
      release-sha256: ${{ matrix.release-sha256 }}
