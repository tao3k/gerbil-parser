name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust-rowan:
    name: Rust/Rowan AOT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify ASP Rust source policy
        run: cargo test -p gerbil-parser-build-support --test asp-rust-gate --locked -- --nocapture

      - name: Verify Rust contracts
        run: cargo test --workspace --locked

      - name: Verify downstream Cargo-only language consumer
        run: cargo test --locked --manifest-path t/fixtures/rust-rowan-downstream/Cargo.toml

      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify publishable Rust products
        run: cargo package -p gerbil-parser-rowan --locked --allow-dirty

      - name: Verify generated-table Rowan engine red zones
        run: cargo test --release -p gerbil-parser-rowan-scenarios --test performance_test -- --ignored --nocapture --test-threads=1

  native-gerbil:
    name: Native Gerbil parser and language packs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gerbil-label: release-v0.19-2591dcd
          - os: macos-latest
            gerbil-label: release-v0.19-2591dcd
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ matrix.gerbil-label }}
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$macos_major.0" >> "$GITHUB_ENV"

      - name: Detect native build capacity
        run: |
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          test "$cores" -gt 0
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"
          echo "Native Gerbil capacity: $cores cores"

      - name: Install immutable Gerbil v0.19 release
        shell: bash
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"

      - name: Restore Gerbil package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install declared package dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          if [ "${{ steps.package-cache.outputs.cache-hit }}" = "true" ]; then
            if ! gerbil env gerbil interactive -e '(begin (import :poo-flow/src/core/api :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependency-cache-ready"))'; then
              gerbil deps --update
            fi
          else
            gerbil deps --install
          fi
          gerbil env gerbil interactive -e '(begin (import :poo-flow/src/core/api :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependencies-ready"))'

      - name: Save Gerbil package cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ hashFiles('gerbil.pkg') }}

      - name: Build parser and versioned language packs
        run: |
          gerbil clean
          GERBIL_BUILD_VERBOSE=1 gerbil build
          cc -std=c11 -Wall -Wextra -Werror \
            -Wno-unused-command-line-argument -fsyntax-only \
            -Iinclude t/native-ffi-header-smoke.c

      - name: Build optional native commands
        run: |
          gerbil env gxi build-gparse.ss compile
          gerbil env gxi build-rust-rowan-aot.ss compile

      - name: Compile Scheme test support
        run: |
          gerbil env gxc t/line-structure-assertions.ss
          gerbil env gxc \
            t/fixtures/rust-rowan-downstream/languages/records/v1/grammar.ss \
            t/fixtures/rust-rowan-downstream/languages/records/v1/parser.ss \
            t/fixtures/rust-rowan-downstream/languages/records/v1/fixtures.ss

      - name: Run native Gerbil tests
        timeout-minutes: 15
        run: gerbil test -v 3 t/... languages/...

      - name: Verify Rust/Rowan AOT generation is current
        run: |
          arithmetic_generated="$(mktemp)"
          gerbil env gxi generate-rust-rowan.ss "$arithmetic_generated"
          rustfmt --edition 2024 "$arithmetic_generated"
          cmp "$arithmetic_generated" rust/gerbil-parser-rowan-arithmetic/src/generated/mod.rs

      - name: Verify Scheme event strategy AOT fixture
        run: |
          event_generated="$(mktemp)"
          grammar_generated="$(mktemp)"
          fold_ir_generated="$(mktemp)"
          gerbil env gxi t/generate-event-strategy-fixture.ss "$event_generated"
          gerbil env gxi t/generate-event-strategy-grammar.ss "$grammar_generated"
          gerbil env gxi t/generate-event-fold-ir.ss "$fold_ir_generated"
          rustfmt --edition 2024 "$event_generated" "$grammar_generated"
          cmp "$event_generated" rust/gerbil-parser-rowan/tests/unit/event_strategy_generated.rs
          cmp "$grammar_generated" rust/gerbil-parser-rowan/tests/unit/event_strategy_grammar.rs
          cmp "$fold_ir_generated" t/fixtures/event_fold.ir.json

      - name: Verify Scheme pure owned-string AOT fixture
        run: |
          owned_generated="$(mktemp)"
          gerbil env gxi t/generate-owned-word-fixture.ss "$owned_generated"
          cmp "$owned_generated" rust/gerbil-parser-rowan/tests/unit/owned_first_word_generated.rs

      - name: Verify downstream custom Rust/Rowan language pack
        run: |
          fixture="t/fixtures/rust-rowan-downstream"
          generated="$(mktemp)"
          clean_home="$RUNNER_TEMP/rowan-aot-home"
          mkdir -p "$clean_home"
          gerbil env gxc \
            "$fixture/languages/records/v1/grammar.ss" \
            "$fixture/languages/records/v1/parser.ss" \
            "$fixture/languages/records/v1/fixtures.ss" \
            "$fixture/languages/records/v1/parser-test.ss"
          env -i \
            HOME="$clean_home" \
            PATH=/usr/bin:/bin \
            GERBIL_PATH="$PWD/.gerbil" \
            GERBIL_PARSER_ROWAN_AOT_LIB="$PWD/.gerbil/lib:$GERBIL_HOME/lib" \
            "$PWD/.gerbil/bin/gerbil-parser-rowan-aot" \
            "$fixture/languages/records/v1/grammar.ss" \
            "$generated"
          rustfmt --edition 2024 "$generated"
          cmp "$generated" "$fixture/src/generated/records_v1.rs"

      - name: Verify native command
        run: |
          gerbil env gparse help
          gerbil env gparse check "1 + 2 * value"
