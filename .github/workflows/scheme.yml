name: Prepared Scheme qualification
'on':
  workflow_call:
    inputs:
      os:
        required: true
        type: string
      gerbil-label:
        required: true
        type: string
      release-os:
        required: true
        type: string
      release-arch:
        required: true
        type: string
      release-tag:
        required: true
        type: string
      release-sha256:
        required: true
        type: string
permissions:
  contents: read
jobs:
  prepare:
    name: Prepare Scheme (${{ inputs.release-os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
      GERBIL_SDK_SHA256: ${{ inputs.release-sha256 }}
      GERBIL_PREPARED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Activate immutable Gerbil SDK
        uses: ./.github/actions/gerbil-setup
        with:
          release-os: ${{ inputs.release-os }}
          release-arch: ${{ inputs.release-arch }}
          release-tag: ${{ inputs.release-tag }}
          release-sha256: ${{ inputs.release-sha256 }}
      - name: Restore Gerbil package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg') }}
      - name: Install declared package dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          if [ "${{ steps.package-cache.outputs.cache-hit }}" = "true" ]; then
            if ! gerbil env gerbil interactive -e '(begin (import :core/object-family/interface :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependency-cache-ready"))'; then
              gerbil deps --update
            fi
          else
            gerbil deps --install
          fi
          gerbil env gerbil interactive -e '(begin (import :core/object-family/interface :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependencies-ready"))'
      - name: Save Gerbil package cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg') }}
      - name: Build parser and language packs
        run: |
          gerbil clean
          GERBIL_BUILD_VERBOSE=1 gerbil build
          "${GERBIL_GCC:-gcc}" -std=c11 -Wall -Wextra -Werror \
            -fsyntax-only \
            -Iinclude t/ffi-header-smoke.c
      - name: Build optional compiled commands
        run: |
          gerbil env gxi build-gparse.ss compile
          gerbil env gxi build-rust-runtime-aot.ss compile
      - name: Compile test exit support
        run: gerbil env gxi build-test-driver.ss compile
      - name: Compile qualification boundary
        run: gerbil env gxi build-qualification.ss compile
      - name: Compile reusable Scheme library objects
        run: |
          gerbil env gxi qualify.ss run --timeout 240 --idle-timeout 5 \
            --log .data/native-library-objects.log --require COMPILED-LIBRARY-OBJECTS-READY \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!)' \
            -e '(call-with-compiled-interface-trace (lambda () (load "build-language-conformance-link.ss") (eval (quote (main "library-objects"))))) (exit 0)'
      - name: Restore conformance preparation
        id: conformance-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gerbil/conformance-store
          key: parser-conformance-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg') }}-${{ github.sha }}
          restore-keys: |
            parser-conformance-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg') }}-
      - name: Compile language conformance modules
        run: |
          GERBIL_BUILD_VERBOSE=1 GERBIL_PARSER_LR_TRACE=1 \
            gerbil env gxi qualify.ss run --timeout 240 --idle-timeout 5 \
              --log .data/language-conformance-build.log \
              -- gxi build-conformance.ss
      - name: Save admitted conformance preparation
        if: steps.conformance-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: .gerbil/conformance-store
          key: parser-conformance-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg') }}-${{ github.sha }}
      - name: Compile Scheme test support
        run: |
          gerbil env gxc t/abi-datum-support.ss \
            t/line-structure-assertions.ss \
            t/benchmarks/lr-request-stack/derivation.ss \
            t/scenarios/performance/selective-glr/scenario.ss \
            t/benchmarks/lr-request-stack/benchmark.ss \
            t/benchmarks/gql/runtime/actors.ss
          if [ "$RUNNER_OS" = macOS ]; then
            gerbil env gxc -ld-options "-Wl,-undefined,dynamic_lookup" \
              t/benchmarks/gql/runtime/compiled-timing.ss
          else
            gerbil env gxc t/benchmarks/gql/runtime/compiled-timing.ss
          fi
          gerbil env gxc t/header-delimiter-test.ss \
            t/structured-lexical-cases.ss \
            t/structured-lexical-test.ss \
            t/module-source-cases.ss \
            t/module-source-test.ss \
            t/fixtures/shared-scanner/bash.ss
      - name: Prepare gxtest source owners
        run: |
          gerbil env gxi qualify.ss run --timeout 240 --idle-timeout 5 \
            --log .data/gxtest-source-prepare.log \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!)' \
            -e '(call-with-compiled-interface-trace (lambda () (load "build-language-conformance.ss") (eval (quote (prepare-gxtest!))))) (exit 0)'
      - name: Compile FFI Scheme fixtures once
        run: GERBIL_BUILD_VERBOSE=1 gerbil env gxi build-ffi-tests.ss compile
      - name: Prepare standalone language library once
        run: |-
          library="$PWD/.gerbil/ci/libparsernative.so"
          if [ "$RUNNER_OS" = macOS ]; then library="$PWD/.gerbil/ci/libparsernative.dylib"; fi
          mkdir -p .gerbil/ci
          gerbil env gxi qualify.ss shared-library --language-module gerbil-parser/t/fixtures/shared-scanner/records-engine-abi --output "$library"
      - name: Pack exact-head Scheme products
        run: bash tools/ci/prepared-products.sh pack "$RUNNER_TEMP/scheme-products.tar.gz"
      - name: Publish prepared Scheme products
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheme-${{ inputs.release-os }}-${{ inputs.release-arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/scheme-products.tar.gz
          retention-days: 2
          compression-level: 0
      - name: Upload preparation logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ inputs.release-os }}-prepare-${{ github.sha }}
          path: .data/**/*.log
          if-no-files-found: ignore
          retention-days: 7
  semantics:
    name: semantics (${{ inputs.release-os }})
    needs: prepare
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
      GERBIL_SDK_SHA256: ${{ inputs.release-sha256 }}
      GERBIL_PREPARED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Activate immutable Gerbil SDK
        uses: ./.github/actions/gerbil-setup
        with:
          release-os: ${{ inputs.release-os }}
          release-arch: ${{ inputs.release-arch }}
          release-tag: ${{ inputs.release-tag }}
          release-sha256: ${{ inputs.release-sha256 }}
      - name: Download exact-head Scheme products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-${{ inputs.release-os }}-${{ inputs.release-arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/scheme-products
      - name: Admit prepared Scheme products
        run: bash tools/ci/prepared-products.sh restore "$RUNNER_TEMP/scheme-products/scheme-products.tar.gz"
      - name: Verify native process contracts
        run: just test-process-contracts
      - name: Verify official module loading and source invalidation
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/module-loading-controls.log \
            --require MODULE-LOADING-CONTROLS-OK \
            -- gxi t/benchmarks/module-loading/controls.ss
      - name: Verify generated arithmetic Scheme LR is current
        run: gerbil env gxi t/benchmarks/arithmetic-scale/generate-fused-lr.ss check src/compiler/arithmetic-drive.ss
      - name: Verify generic POO Scheme reductions are current
        run: |
          gerbil env gxi scripts/generate-reductions.ss check :gerbil-parser/languages/hcl/grammar src/compiler/hcl-reductions.ss
          gerbil env gxi scripts/generate-reductions.ss check :gerbil-parser/languages/arithmetic/grammar t/fixtures/arithmetic-reductions.ss
      - name: Verify generated HCL recursive parser is current
        run: gerbil env gxi scripts/generate-source-parser.ss check :gerbil-parser/languages/hcl/grammar src/compiler/hcl-source.ss
      - name: Verify Scheme preparation and test ownership controls
        run: |
          gerbil env gxi scripts/tests/process-qualification-test.ss
          gerbil env gxi scripts/tests/compiler-process-test.ss
          gerbil env gxi scripts/tests/preparation-test.ss
          gerbil env gxi scripts/tests/test-plan-test.ss
          gerbil env gxi test-processes.ss conformance
      - name: Verify Scheme DSL and POO declaration closure
        id: dsl-research
        run: gerbil env gxi test-processes.ss research .data/dsl-research
      - name: Diagnose failed Ubuntu semantic process
        if: ${{ failure() && runner.os == 'Linux' && steps.dsl-research.outcome == 'failure' }}
        run: |
          if ! command -v gdb; then
            sudo apt-get update
            sudo apt-get install -y gdb
          fi
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/dsl-research-gdb.log \
            -- gdb --nx --batch --return-child-result \
               -ex run -ex 'thread apply all bt' \
               --args .gerbil/bin/gerbil-parser-conformance semantic
      - name: Verify Source caller survives natural collection
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/source-callback-gc.log --require SOURCE-CALLBACK-GC-OK \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (call-with-compiled-interface-trace (lambda () (eval (quote (import :gerbil-parser/t/benchmarks/source-edits/benchmark))) (eval (quote (verify-callback-gc)))))'
      - name: Verify shared-runtime Worker controls
        run: gerbil env gxi test-processes.ss workers
      - name: Run Scheme tests
        timeout-minutes: 15
        run: |
          GERBIL_PATH="$PWD/.gerbil" GERBIL_LOADPATH="$PWD" \
            GERBIL_TEST_CORES=2 GAMBOPT=max-heap=3G,debug=q GERBIL_PARSER_LR_TRACE=1 \
            gerbil env gxi t/fixtures/tla-sany-differential/test-suite.ss --remaining-conformance t languages
      - name: Verify native command
        run: |
          gerbil env gparse help
          gerbil env gparse check "1 + 2 * value"
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ inputs.release-os }}-semantics-suite-${{ github.sha }}
          path: .data/**/*.log
          if-no-files-found: ignore
          retention-days: 7
  generation:
    name: generation (${{ inputs.release-os }})
    needs: prepare
    runs-on: ${{ inputs.os }}
    timeout-minutes: 45
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
      GERBIL_SDK_SHA256: ${{ inputs.release-sha256 }}
      GERBIL_PREPARED_HEAD: ${{ github.sha }}
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Activate immutable Gerbil SDK
        uses: ./.github/actions/gerbil-setup
        with:
          release-os: ${{ inputs.release-os }}
          release-arch: ${{ inputs.release-arch }}
          release-tag: ${{ inputs.release-tag }}
          release-sha256: ${{ inputs.release-sha256 }}
      - name: Download exact-head Scheme products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-${{ inputs.release-os }}-${{ inputs.release-arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/scheme-products
      - name: Admit prepared Scheme products
        run: bash tools/ci/prepared-products.sh restore "$RUNNER_TEMP/scheme-products/scheme-products.tar.gz"
      - name: Verify header-derived delimiter Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/header-delimiter-generation.log \
            --require HEADER-DELIMITER-HL7-GENERATED --require HEADER-DELIMITER-RECORD-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-header-delimiters.ss")' \
            t/generate-header-delimiters.ss /tmp/hl7-header.rs /tmp/header-record.rs
          rustfmt --edition 2024 /tmp/hl7-header.rs /tmp/header-record.rs
          cmp /tmp/hl7-header.rs rust/gerbil-parser-runtime/tests/fixtures/generated/hl7_header.rs
          cmp /tmp/header-record.rs rust/gerbil-parser-runtime/tests/fixtures/generated/header_record.rs
      - name: Verify strict quoted profile Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/structured-lexical-generation.log \
            --require STRUCTURED-LEXICAL-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-module "gerbil-parser/t/structured-lexical-test")' \
            t/generate-structured-lexical.ss /tmp/structured-lexical.rs
          rustfmt --edition 2024 /tmp/structured-lexical.rs
          cmp /tmp/structured-lexical.rs rust/gerbil-parser-runtime/tests/fixtures/generated/structured_lexical.rs
          gerbil env gxi t/generate-scheme-alphabetic-class.ss /tmp/scheme-alphabetic.rs
          rustfmt --edition 2024 /tmp/scheme-alphabetic.rs
          cmp /tmp/scheme-alphabetic.rs rust/gerbil-parser-runtime/src/engine/unicode_alphabetic.rs
          gerbil env gxi t/generate-scheme-numeric-class.ss /tmp/scheme-numeric.rs
          rustfmt --edition 2024 /tmp/scheme-numeric.rs
          cmp /tmp/scheme-numeric.rs rust/gerbil-parser-runtime/src/engine/unicode_numeric.rs
          gerbil env gxi t/generate-quoted-string-profile.ss /tmp/quoted-profile.rs
          rustfmt --edition 2024 /tmp/quoted-profile.rs
          cmp /tmp/quoted-profile.rs rust/gerbil-parser-runtime/tests/fixtures/quoted_profile_generated.rs
          gerbil env gxi t/generate-text-profile.ss /tmp/fhirpath-profile.rs
          rustfmt --edition 2024 /tmp/fhirpath-profile.rs
          cmp /tmp/fhirpath-profile.rs rust/gerbil-parser-runtime/tests/fixtures/generated/fhirpath_profile.rs
      - name: Verify prepared module framing Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/module-source-generation.log --require MODULE-SOURCE-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-module "gerbil-parser/t/module-source-test")' \
            t/generate-module-source.ss /tmp/module-source.rs
          rustfmt --edition 2024 /tmp/module-source.rs
          cmp /tmp/module-source.rs rust/gerbil-parser-runtime/tests/fixtures/generated/module_source.rs
          gerbil env gxi t/generate-scheme-whitespace-class.ss /tmp/scheme-whitespace.rs
          rustfmt --edition 2024 /tmp/scheme-whitespace.rs
          cmp /tmp/scheme-whitespace.rs rust/gerbil-parser-runtime/src/engine/unicode_whitespace.rs
      - name: Verify shared result projection Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/result-projections-generation.log --require RESULT-PROJECTIONS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-result-projections.ss")' \
            t/generate-result-projections.ss /tmp/result-projections.rs
          rustfmt --edition 2024 /tmp/result-projections.rs
          cmp /tmp/result-projections.rs rust/gerbil-parser-runtime/tests/fixtures/generated/result_projections.rs
      - name: Verify ordered result catalog Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/ordered-results-generation.log --require ORDERED-RESULTS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-ordered-results.ss")' \
            t/generate-ordered-results.ss /tmp/ordered-results.rs
          rustfmt --edition 2024 /tmp/ordered-results.rs
          cmp /tmp/ordered-results.rs rust/gerbil-parser-runtime/tests/fixtures/generated/ordered_results.rs
      - name: Verify shared Command Source Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/command-source-generation.log --require COMMAND-SOURCE-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-command-source.ss")' \
            t/generate-command-source.ss /tmp/command-source.rs /tmp/command-source.bin
          rustfmt --edition 2024 /tmp/command-source.rs
          cmp /tmp/command-source.rs rust/gerbil-parser-runtime/tests/fixtures/generated/command_source.rs
          cmp /tmp/command-source.bin rust/gerbil-parser-runtime/tests/fixtures/generated/command_source.bin
      - name: Verify shared Word and Binding Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/word-parts-generation.log --require WORD-PARTS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-word-parts.ss")' \
            t/generate-word-parts.ss /tmp/word-parts.rs
          rustfmt --edition 2024 /tmp/word-parts.rs
          cmp /tmp/word-parts.rs rust/gerbil-parser-runtime/tests/fixtures/generated/word_parts.rs
      - name: Verify shared region recognition Rust AOT regeneration
        run: |
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/region-boundaries-generation.log --require REGION-BOUNDARIES-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-region-boundaries.ss")' \
            t/generate-region-boundaries.ss /tmp/region-boundaries.rs
          rustfmt --edition 2024 /tmp/region-boundaries.rs
          cmp /tmp/region-boundaries.rs rust/gerbil-parser-runtime/tests/fixtures/generated/region_boundaries.rs
      - name: Verify shared scanner and contextual Rust AOT regeneration
        run: |
          gerbil env gxi t/fixtures/shared-scanner/generate.ss /tmp/shared-scanner.rs
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/bash-scanner-generation.log --require BASH-SCANNER-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-module "gerbil-parser/t/fixtures/shared-scanner/bash")' \
            t/fixtures/shared-scanner/generate-bash.ss /tmp/bash-scanner.rs
          rustfmt --edition 2024 /tmp/bash-scanner.rs
          cmp /tmp/bash-scanner.rs rust/gerbil-parser-runtime/tests/fixtures/generated/bash_scanner.rs
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log /tmp/binding-names-generation.log --require BINDING-NAMES-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-compiled-interfaces!) (preload-test-imports "t/generate-binding-names.ss")' \
            t/generate-binding-names.ss /tmp/binding-names.rs
          rustfmt --edition 2024 /tmp/binding-names.rs
          cmp /tmp/binding-names.rs rust/gerbil-parser-runtime/tests/fixtures/generated/binding_names.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-contextual.ss /tmp/records-contextual.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-artifact.ss /tmp/artifact.rs
          rustfmt --edition 2024 /tmp/artifact.rs
          cmp /tmp/artifact.rs rust/gerbil-parser-runtime/tests/fixtures/artifact_generated.rs
          rustfmt --edition 2024 /tmp/shared-scanner.rs /tmp/records-contextual.rs
          cmp /tmp/shared-scanner.rs rust/gerbil-parser-runtime/tests/fixtures/shared_scanner_generated.rs
          cmp /tmp/records-contextual.rs rust/gerbil-parser-runtime/tests/fixtures/records_contextual_generated.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-abi.ss /tmp/records-abi.ss /tmp/records-abi.h
          cmp /tmp/records-abi.ss t/fixtures/shared-scanner/records-abi.ss
          cmp /tmp/records-abi.h t/fixtures/shared-scanner/records-abi.h
          gerbil env gxc t/fixtures/shared-scanner/records.ss
      - name: Verify Rust AOT generation is current
        run: |
          arithmetic_generated="$(mktemp)"
          gerbil env gxi generate-rust-runtime.ss "$arithmetic_generated"
          rustfmt --edition 2024 "$arithmetic_generated"
          cmp "$arithmetic_generated" build-support/gerbil-parser-build-support/tests/fixtures/generated/arithmetic.rs
      - name: Verify Scheme event strategy AOT fixture
        run: |
          event_generated="$(mktemp)"
          grammar_generated="$(mktemp)"
          fold_ir_generated="$(mktemp)"
          outline_ir_generated="$(mktemp)"
          gerbil env gxi t/generate-event-strategy-fixture.ss "$event_generated"
          gerbil env gxi t/generate-event-strategy-grammar.ss "$grammar_generated"
          gerbil env gxi t/generate-event-fold-ir.ss "$fold_ir_generated"
          gerbil env gxi t/generate-outline-fold-ir.ss "$outline_ir_generated"
          rustfmt --edition 2024 "$event_generated" "$grammar_generated"
          cmp "$event_generated" rust/gerbil-parser-runtime/tests/unit/event_strategy_generated.rs
          cmp "$grammar_generated" rust/gerbil-parser-runtime/tests/unit/event_strategy_grammar.rs
          cmp "$fold_ir_generated" t/fixtures/event_fold.ir.json
          cmp "$outline_ir_generated" t/fixtures/outline_fold.ir.json
      - name: Verify Scheme pure owned-string AOT fixture
        run: |
          owned_generated="$(mktemp)"
          gerbil env gxi t/generate-owned-word-fixture.ss "$owned_generated"
          cmp "$owned_generated" rust/gerbil-parser-runtime/tests/unit/owned_first_word_generated.rs
      - name: Verify record assignments Rust language pack
        run: |
          fixture="t/fixtures/runtime-record-assignments"
          generated="$(mktemp)"
          clean_home="$RUNNER_TEMP/runtime-aot-home"
          mkdir -p "$clean_home"
          gerbil env gxc \
            "$fixture/languages/records/grammar.ss" \
            "$fixture/languages/records/fixtures.ss" \
            "$fixture/languages/records/parser.ss" \
            "$fixture/languages/records/parser-test.ss"
          env -i \
