name: Prepared Scheme qualification
'on':
  workflow_call:
    inputs:
      cpu-scope:
        required: false
        type: string
        default: all
      os:
        required: true
        type: string
      gerbil-label:
        required: true
        type: string
      release-os:
        required: true
        type: string
      release-arch:
        required: true
        type: string
      release-tag:
        required: true
        type: string
      release-sha256:
        required: true
        type: string
permissions:
  contents: read
env:
  # Native qualified imports: compiled products before the package source parent.
  GERBIL_PATH: ${{ github.workspace }}/.gerbil
  GERBIL_LOADPATH: ${{ github.workspace }}/.gerbil/lib:${{ github.workspace }}/..
  GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
  GERBIL_SDK_SHA256: ${{ inputs.release-sha256 }}
jobs:
  prepare:
    name: Prepare Scheme (${{ inputs.release-os }})
    runs-on: ${{ inputs.os }}
    timeout-minutes: 120
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Activate Gerbil compiler
        uses: ./.github/actions/gerbil-setup
        with:
          release-os: ${{ inputs.release-os }}
          release-arch: ${{ inputs.release-arch }}
          release-tag: ${{ inputs.release-tag }}
          release-sha256: ${{ inputs.release-sha256 }}
      - name: Restore Gerbil package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg', 'dev/gerbil.pkg') }}
      - name: Install declared package dependencies
        run: |
          mkdir -p "$GERBIL_PATH/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          gerbil deps --install
          (cd dev && GERBIL_PATH="$GITHUB_WORKSPACE/.gerbil" gerbil deps --install)
      - name: Verify native dependency index output
        # Keep the editor-index control distinct from the native catalog below.
        run: test -s "$GERBIL_PATH/pkg/TAGS"
      - name: Save Gerbil package cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}-${{ hashFiles('gerbil.pkg', 'dev/gerbil.pkg') }}
      # Development compilation adds foreign namespace artifacts to the prefix.
      # Finish it before the base writer snapshots the complete dependency set.
      - name: Qualify development catalog and policy
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" gerbil env gxi dev/build.ss compile
      - name: Build parser and language packs
        run: |
          export GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q"
          # The official env command prepends the package bin directory to PATH.
          # Use it for the base writer as well as every extension writer.
          # Keep executing-host capacity and the heap envelope; the native package writer
          # has no arbitrary180s cutoff. Elapsed time remains diagnostic.
          GERBIL_BUILD_VERBOSE=1 gerbil env just qualify-library
          "${GERBIL_GCC:-gcc}" -std=c11 -Wall -Wextra -Werror \
            -fsyntax-only \
            -Iinclude t/ffi-header-smoke.c
      - name: Build optional compiled commands
        run: |
          export GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q"
          gerbil env gxi build-gparse.ss compile
          gerbil env gxi build-rust-runtime-aot.ss compile
      - name: Compile test exit support
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" gerbil env gxi build-test-driver.ss compile
      - name: Compile qualification boundary
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" gerbil env gxi build-qualification.ss compile
      - name: Verify conformance preparation imports
        run: |
          gerbil env gxi qualify.ss run --timeout 90 \
            --log .data/conformance-preparation-imports.log --require "^OK$" \
            -- gerbil test -v 3 \
              t/build-owner-import-test.ss
      # Core support discovery follows native compiled imports. The C ABI owner
      # must publish its products/options before generic support consumption.
      - name: Compile FFI Scheme fixtures once
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" GERBIL_BUILD_VERBOSE=1 gerbil env gxi build-ffi-tests.ss compile
      - name: Compile language conformance modules
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" GERBIL_BUILD_VERBOSE=1 gerbil env gxi build-language-conformance.ss compile
      # This is Core's signed test-lib publication, distinct from normal
      # research static products and their executable link closure.
      - name: Publish native test support
        run: GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q" GERBIL_BUILD_VERBOSE=1 gerbil env gxi build-test-support.ss compile
      - name: Prepare standalone language library once
        run: |-
          export GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q"
          library="$PWD/.gerbil/ci/libparsernative.so"
          if [ "$RUNNER_OS" = macOS ]; then library="$PWD/.gerbil/ci/libparsernative.dylib"; fi
          mkdir -p .gerbil/ci
          gerbil env gxi qualify.ss shared-library --language-module gerbil-parser/t/fixtures/shared-scanner/records-engine-abi --output "$library"
      - name: Prepare Rust-owned Gerbil ABI program
        run: |
          export GAMBOPT="${GAMBOPT:+${GAMBOPT},}max-heap=2G,debug=q"
          gerbil env just prepare-rust-abi