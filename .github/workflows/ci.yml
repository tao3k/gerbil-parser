name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust-rowan:
    name: Rust/Rowan AOT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify ASP Rust source policy
        run: cargo test -p gerbil-parser-rowan --test asp-rust-gate --locked -- --nocapture

      - name: Verify Rust contracts
        run: cargo test --workspace --locked

      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Verify generated-table Rowan engine red zones
        run: cargo test --release -p gerbil-parser-rowan --test performance_test -- --ignored --nocapture --test-threads=1

  native-gerbil:
    name: Native Gerbil parser and language packs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      GERBIL_REF: add922481cec81d05431db014bcb91b30485cf21
      GERBIL_LABEL: source-v0.18.2-4-gadd92248
      GERBIL_PREFIX: ${{ github.workspace }}/.ci/gerbil/source-v0.18.2-4-gadd92248
      GERBIL_SRC: ${{ github.workspace }}/.ci/gerbil-src/source-v0.18.2-4-gadd92248
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"

      - name: Detect native build capacity
        run: |
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          test "$cores" -gt 0
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"
          echo "Native Gerbil capacity: $cores cores"

      - name: Restore Gerbil install cache
        id: gerbil-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/gerbil/${{ env.GERBIL_LABEL }}
          key: gerbil-parser-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GERBIL_LABEL }}-${{ env.GERBIL_REF }}

      - name: Build native Gerbil
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$(dirname "$GERBIL_SRC")" "$(dirname "$GERBIL_PREFIX")"
          git clone https://git.cons.io/mighty-gerbils/gerbil "$GERBIL_SRC"
          cd "$GERBIL_SRC"
          git checkout "$GERBIL_REF"
          ./configure --prefix="$GERBIL_PREFIX" --enable-march=
          echo "(def (gerbil-version-string) \"ci-$GERBIL_REF\")" > src/gerbil/runtime/version.ss
          . ./build-env.sh
          for target in prepare gambit boot-gxi stage0 stage1 stdlib libgerbil lang r7rs-large srfi tools; do
            ./src/build.sh "$target"
          done
          ./install.sh

      - name: Save Gerbil install cache
        if: steps.gerbil-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci/gerbil/${{ env.GERBIL_LABEL }}
          key: gerbil-parser-native-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GERBIL_LABEL }}-${{ env.GERBIL_REF }}

      - name: Activate native Gerbil
        run: |
          echo "$GERBIL_PREFIX/bin" >> "$GITHUB_PATH"
          "$GERBIL_PREFIX/bin/gerbil" --version
          "$GERBIL_PREFIX/bin/gerbil" interactive -e '(displayln "gerbil-ready")'

      - name: Restore Gerbil package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GERBIL_LABEL }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install declared package dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          if [ "${{ steps.package-cache.outputs.cache-hit }}" = "true" ]; then
            if ! gerbil env gerbil interactive -e '(begin (import :poo-flow/src/core/api :asp-gerbil-scheme/build-api :asp-gerbil-scheme/testing-api) (displayln "dependency-cache-ready"))'; then
              gerbil deps --update
            fi
          else
            gerbil deps --install
          fi
          gerbil env gerbil interactive -e '(begin (import :poo-flow/src/core/api :asp-gerbil-scheme/build-api :asp-gerbil-scheme/testing-api) (displayln "dependencies-ready"))'

      - name: Save Gerbil package cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v1-${{ runner.os }}-${{ runner.arch }}-${{ env.GERBIL_LABEL }}-${{ hashFiles('gerbil.pkg') }}

      - name: Build parser and versioned language packs
        run: |
          gerbil clean
          gerbil build

      - name: Build optional native command
        run: gerbil env gxi build-gparse.ss compile

      - name: Run the single native test entrypoint
        timeout-minutes: 15
        run: gerbil env ./unit-tests.ss

      - name: Verify Rust/Rowan AOT generation is current
        run: |
          arithmetic_generated="$(mktemp)"
          gql_generated="$(mktemp)"
          gerbil env gxi generate-rust-rowan.ss "$arithmetic_generated"
          gerbil env gxi generate-gql-rust-rowan.ss "$gql_generated"
          rustfmt --edition 2024 "$arithmetic_generated" "$gql_generated"
          cmp "$arithmetic_generated" rust/gerbil-parser-rowan/src/generated/arithmetic_v1.rs
          cmp "$gql_generated" rust/gerbil-parser-rowan/src/generated/gql_iso_39075_2024.rs

      - name: Verify downstream custom Rust/Rowan language pack
        run: |
          fixture="t/fixtures/rust-rowan-downstream"
          gerbil env gxi "$fixture/test.ss"
          gerbil env gxi "$fixture/generate.ss" \
            "$fixture/src/generated/records_v1.rs"
          cargo test --locked --manifest-path "$fixture/Cargo.toml"

      - name: Verify native command
        run: |
          gerbil env gparse help
          gerbil env gparse check "1 + 2 * value"
