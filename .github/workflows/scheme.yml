            GERBIL_PARSER_RUNTIME_AOT_LIB="$PWD/.gerbil/lib:$GERBIL_HOME/lib" \
            "$PWD/.gerbil/bin/gerbil-parser-runtime-aot" \
            "$fixture/languages/records/grammar.ss" \
            "$generated"
          rustfmt --edition 2024 "$generated"
          cmp "$generated" "$fixture/src/generated/records.rs"
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
