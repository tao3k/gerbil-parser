name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  rust-rowan:
    name: Rust/Rowan AOT runtime
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify native compiler progress proxy
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verify Rust formatting
        run: cargo fmt --all -- --check

      - name: Verify ASP Rust source policy
        run: cargo test -p gerbil-parser-build-support --test asp-rust-gate --locked -- --nocapture

      - name: Verify Rust contracts
        run: cargo test --workspace --all-features --locked

      - name: Verify record assignments Cargo consumer
        run: cargo test --locked --manifest-path t/fixtures/rowan-record-assignments/Cargo.toml

      - name: Verify external ASCII digit adapter
        run: |
          cargo fmt --manifest-path t/fixtures/rowan-ascii-digit-run/Cargo.toml -- --check
          cargo test --locked --manifest-path t/fixtures/rowan-ascii-digit-run/Cargo.toml

      - name: Verify Rust lints
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify publishable Rust products
        run: cargo package -p gerbil-parser-rowan --locked --allow-dirty

      - name: Verify generated-table Rowan engine red zones
        run: cargo test --release -p gerbil-parser-build-support --test performance_test -- --ignored --nocapture --test-threads=1

  native-gerbil:
    name: Native Gerbil parser and language packs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gerbil-label: release-v0.19-2591dcd
          - os: macos-latest
            gerbil-label: release-v0.19-2591dcd
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ matrix.gerbil-label }}
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Verify native execution evidence
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            ca-certificates \
            curl \
            git \
            jq \
            libsqlite3-dev \
            libssl-dev \
            openjdk-17-jre-headless \
            openssl \
            pkg-config \
            sqlite3 \
            zlib1g-dev

      - name: Install macOS system dependencies
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
          HOMEBREW_NO_INSTALL_CLEANUP: 1
        run: |
          brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
          brew install gcc jq openssl pkg-config sqlite zlib
          gcc_prefix="$(brew --prefix gcc)"
          gcc_bin="$(
            find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
              | awk -F- '{print $NF "\t" $0}' \
              | sort -n \
              | tail -n 1 \
              | cut -f2-
          )"
          test -x "$gcc_bin"
          echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
          openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
          macos_major="$(sw_vers -productVersion | cut -d. -f1)"
          echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=$macos_major.0" >> "$GITHUB_ENV"

      - name: Detect native build capacity
        run: |
          cores="$(getconf _NPROCESSORS_ONLN 2>/dev/null || sysctl -n hw.ncpu)"
          test "$cores" -gt 0
          echo "GERBIL_BUILD_CORES=$cores" >> "$GITHUB_ENV"
          echo "Native Gerbil capacity: $cores cores"

      - name: Install immutable Gerbil v0.19 release
        shell: bash
        run: bash tools/ci/install-gerbil-v19-release.sh "$GERBIL_RELEASE_ROOT"

      - name: Restore Gerbil package cache
        id: package-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ hashFiles('gerbil.pkg') }}

      - name: Install declared package dependencies
        run: |
          mkdir -p "$HOME/.gerbil/pkg"
          gerbil pkg dir --add git.cons.io/mighty-gerbils/gerbil-directory
          if [ "${{ steps.package-cache.outputs.cache-hit }}" = "true" ]; then
            if ! gerbil env gerbil interactive -e '(begin (import :core/object-family/interface :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependency-cache-ready"))'; then
              gerbil deps --update
            fi
          else
            gerbil deps --install
          fi
          gerbil env gerbil interactive -e '(begin (import :core/object-family/interface :asp-gerbil-scheme/building-api :asp-gerbil-scheme/src/benchmark/framework) (displayln "dependencies-ready"))'

      - name: Save Gerbil package cache
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .gerbil/pkg
            .gerbil/lib
            .gerbil/bin
          key: gerbil-parser-packages-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.gerbil-label }}-${{ hashFiles('gerbil.pkg') }}

      - name: Build parser and versioned language packs
        run: |
          gerbil clean
          GERBIL_BUILD_VERBOSE=1 gerbil build
          cc -std=c11 -Wall -Wextra -Werror \
            -Wno-unused-command-line-argument -fsyntax-only \
            -Iinclude t/native-ffi-header-smoke.c

      - name: Verify generated arithmetic Scheme LR is current
        run: gerbil env gxi t/benchmarks/arithmetic-scale/generate-fused-lr.ss check src/compiler/arithmetic-drive.ss

      - name: Verify generic POO Scheme reductions are current
        run: |
          gerbil env gxi scripts/generate-reductions.ss check :gerbil-parser/languages/hcl/grammar src/compiler/hcl-reductions.ss
          gerbil env gxi scripts/generate-reductions.ss check :gerbil-parser/languages/arithmetic/grammar t/fixtures/arithmetic-reductions.ss

      - name: Verify generated HCL recursive parser is current
        run: gerbil env gxi scripts/generate-source-parser.ss check :gerbil-parser/languages/hcl/grammar src/compiler/hcl-source.ss

      - name: Build optional native commands
        run: |
          gerbil env gxi build-gparse.ss compile
          gerbil env gxi build-rust-rowan-aot.ss compile

      - name: Verify Scheme DSL and native POO declaration closure
        run: gerbil env bash scripts/check-dsl-research.sh .data/dsl-research

      - name: Compile Scheme test support
        run: |
          gerbil env gxc t/native-datum-support.ss \
            t/line-structure-assertions.ss \
            t/benchmarks/gql/runtime/reduction-counts.ss \
            t/benchmarks/gql/runtime/execution-counts.ss \
            t/benchmarks/gql/runtime/matched-stages.ss \
            t/benchmarks/gql/runtime/actors.ss
          gerbil env gxi build-native-test-driver.ss compile
          if [ "$RUNNER_OS" = macOS ]; then
            gerbil env gxc -ld-options "-Wl,-undefined,dynamic_lookup" \
              t/benchmarks/gql/runtime/native-timing.ss
          else
            gerbil env gxc t/benchmarks/gql/runtime/native-timing.ss
          fi
          gerbil env gxc \
            t/fixtures/rowan-record-assignments/languages/records/grammar.ss \
            t/fixtures/rowan-record-assignments/languages/records/fixtures.ss \
            t/fixtures/rowan-record-assignments/languages/records/parser.ss \
            t/header-delimiter-test.ss \
            t/structured-lexical-cases.ss \
            t/structured-lexical-test.ss \
            t/module-source-cases.ss \
            t/module-source-test.ss \
            t/fixtures/shared-scanner/bash.ss

      - name: Verify header-derived delimiter Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log .data/header-delimiter-generation.log \
            --require HEADER-DELIMITER-HL7-GENERATED --require HEADER-DELIMITER-RECORD-GENERATED \
            -- gxi t/generate-header-delimiters.ss /tmp/hl7-header.rs /tmp/header-record.rs
          rustfmt --edition 2024 /tmp/hl7-header.rs /tmp/header-record.rs
          cmp /tmp/hl7-header.rs rust/gerbil-parser-rowan/tests/fixtures/generated/hl7_header.rs
          cmp /tmp/header-record.rs rust/gerbil-parser-rowan/tests/fixtures/generated/header_record.rs

      - name: Verify strict quoted profile Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/structured-lexical-generation.log \
            --require STRUCTURED-LEXICAL-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/structured-lexical-test")' \
            t/generate-structured-lexical.ss /tmp/structured-lexical.rs
          rustfmt --edition 2024 /tmp/structured-lexical.rs
          cmp /tmp/structured-lexical.rs rust/gerbil-parser-rowan/tests/fixtures/generated/structured_lexical.rs
          gerbil env gxi t/generate-scheme-alphabetic-class.ss /tmp/scheme-alphabetic.rs
          rustfmt --edition 2024 /tmp/scheme-alphabetic.rs
          cmp /tmp/scheme-alphabetic.rs rust/gerbil-parser-rowan/src/engine/unicode_alphabetic.rs
          gerbil env gxi t/generate-scheme-numeric-class.ss /tmp/scheme-numeric.rs
          rustfmt --edition 2024 /tmp/scheme-numeric.rs
          cmp /tmp/scheme-numeric.rs rust/gerbil-parser-rowan/src/engine/unicode_numeric.rs
          gerbil env gxi t/generate-quoted-string-profile.ss /tmp/quoted-profile.rs
          rustfmt --edition 2024 /tmp/quoted-profile.rs
          cmp /tmp/quoted-profile.rs rust/gerbil-parser-rowan/tests/fixtures/quoted_profile_generated.rs
          gerbil env gxi t/generate-text-profile.ss /tmp/fhirpath-profile.rs
          rustfmt --edition 2024 /tmp/fhirpath-profile.rs
          cmp /tmp/fhirpath-profile.rs rust/gerbil-parser-rowan/tests/fixtures/generated/fhirpath_profile.rs

      - name: Verify prepared module framing Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/module-source-generation.log --require MODULE-SOURCE-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/module-source-test")' \
            t/generate-module-source.ss /tmp/module-source.rs
          rustfmt --edition 2024 /tmp/module-source.rs
          cmp /tmp/module-source.rs rust/gerbil-parser-rowan/tests/fixtures/generated/module_source.rs
          gerbil env gxi t/generate-scheme-whitespace-class.ss /tmp/scheme-whitespace.rs
          rustfmt --edition 2024 /tmp/scheme-whitespace.rs
          cmp /tmp/scheme-whitespace.rs rust/gerbil-parser-rowan/src/engine/unicode_whitespace.rs

      - name: Verify shared result projection Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/result-projections-generation.log --require RESULT-PROJECTIONS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-result-projections.ss")' \
            t/generate-result-projections.ss /tmp/result-projections.rs
          rustfmt --edition 2024 /tmp/result-projections.rs
          cmp /tmp/result-projections.rs rust/gerbil-parser-rowan/tests/fixtures/generated/result_projections.rs

      - name: Verify ordered result catalog Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/ordered-results-generation.log --require ORDERED-RESULTS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-ordered-results.ss")' \
            t/generate-ordered-results.ss /tmp/ordered-results.rs
          rustfmt --edition 2024 /tmp/ordered-results.rs
          cmp /tmp/ordered-results.rs rust/gerbil-parser-rowan/tests/fixtures/generated/ordered_results.rs

      - name: Verify shared Command Source Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/command-source-generation.log --require COMMAND-SOURCE-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-command-source.ss")' \
            t/generate-command-source.ss /tmp/command-source.rs
          rustfmt --edition 2024 /tmp/command-source.rs
          cmp /tmp/command-source.rs rust/gerbil-parser-rowan/tests/fixtures/generated/command_source.rs

      - name: Verify shared Word and Binding Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/word-parts-generation.log --require WORD-PARTS-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-word-parts.ss")' \
            t/generate-word-parts.ss /tmp/word-parts.rs
          rustfmt --edition 2024 /tmp/word-parts.rs
          cmp /tmp/word-parts.rs rust/gerbil-parser-rowan/tests/fixtures/generated/word_parts.rs

      - name: Verify shared region recognition Rust AOT regeneration
        run: |
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/region-boundaries-generation.log --require REGION-BOUNDARIES-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-region-boundaries.ss")' \
            t/generate-region-boundaries.ss /tmp/region-boundaries.rs
          rustfmt --edition 2024 /tmp/region-boundaries.rs
          cmp /tmp/region-boundaries.rs rust/gerbil-parser-rowan/tests/fixtures/generated/region_boundaries.rs

      - name: Verify shared scanner and contextual Rust AOT regeneration
        run: |
          gerbil env gxi t/fixtures/shared-scanner/generate.ss /tmp/shared-scanner.rs
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/bash-scanner-generation.log --require BASH-SCANNER-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/fixtures/shared-scanner/bash")' \
            t/fixtures/shared-scanner/generate-bash.ss /tmp/bash-scanner.rs
          rustfmt --edition 2024 /tmp/bash-scanner.rs
          cmp /tmp/bash-scanner.rs rust/gerbil-parser-rowan/tests/fixtures/generated/bash_scanner.rs
          gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log /tmp/binding-names-generation.log --require BINDING-NAMES-RUST-GENERATED \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "t/generate-binding-names.ss")' \
            t/generate-binding-names.ss /tmp/binding-names.rs
          rustfmt --edition 2024 /tmp/binding-names.rs
          cmp /tmp/binding-names.rs rust/gerbil-parser-rowan/tests/fixtures/generated/binding_names.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-contextual.ss /tmp/records-contextual.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-native-artifact.ss /tmp/native-artifact.rs
          rustfmt --edition 2024 /tmp/native-artifact.rs
          cmp /tmp/native-artifact.rs rust/gerbil-parser-rowan/tests/fixtures/native_artifact_generated.rs
          rustfmt --edition 2024 /tmp/shared-scanner.rs /tmp/records-contextual.rs
          cmp /tmp/shared-scanner.rs rust/gerbil-parser-rowan/tests/fixtures/shared_scanner_generated.rs
          cmp /tmp/records-contextual.rs rust/gerbil-parser-rowan/tests/fixtures/records_contextual_generated.rs
          gerbil env gxi t/fixtures/shared-scanner/generate-native.ss /tmp/records-native.ss /tmp/records-native.h
          cmp /tmp/records-native.ss t/fixtures/shared-scanner/records-native.ss
          cmp /tmp/records-native.h t/fixtures/shared-scanner/records-native.h
          gerbil env gxc t/fixtures/shared-scanner/records.ss

      - name: Compile and call public native C ABI
        run: |
          GERBIL_BUILD_VERBOSE=1 gerbil env gxi build-native-ffi-tests.ss compile
          GERBIL_LOADPATH="$PWD/.gerbil/lib:$PWD" \
            gerbil env python3 scripts/run-bounded.py --timeout 120 --idle-timeout 5 \
            --log .data/native-abi.log --require NATIVE-ABI-OK \
            --require 'ABI-ROWAN-GENERATED-MATCH calls=3' \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/fixtures/native-ffi/abi-probe") (preload-module "gerbil-parser/t/fixtures/tla-sany-differential/exit-child-process")' \
            -e '(import :gerbil-parser/t/fixtures/native-ffi/abi-probe :gerbil-parser/t/fixtures/tla-sany-differential/exit-child-process) (main) (test-child-process-exit! 0)'

      - name: Compile and verify Rust native ownership over the C ABI
        run: |
          RUSTC_WRAPPER="$PWD/scripts/rustc-progress.py" CARGO_TARGET_DIR="$PWD/target" \
            python3 scripts/run-bounded.py --timeout 90 --idle-timeout 30 \
            --log .data/rust-native-build.log \
            -- cargo build --locked --manifest-path t/fixtures/rust-native-language/Cargo.toml
          GERBIL_PARSER_RUST_NATIVE_ARCHIVE="$PWD/target/debug/librust_native_language_fixture.a" \
            GERBIL_BUILD_VERBOSE=1 gerbil env python3 scripts/run-bounded.py \
            --timeout 90 --idle-timeout 30 --log .data/rust-native-link.log \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-test-imports "build-rust-native-tests.ss")' \
            -e '(call-with-native-interface-trace (lambda () (load "build-rust-native-tests.ss") (eval (quote (main "compile")))))'
          GERBIL_LOADPATH="$PWD/.gerbil/lib:$PWD" \
            gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log .data/rust-native-ownership.log --require RUST-NATIVE-OK \
            --require 'RUST-NATIVE-OWNERSHIP-OK handles=2 results=111' \
            --require RUST-NATIVE-100-CALLS \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/fixtures/native-ffi/rust-language-probe")' \
            -e '(import :gerbil-parser/t/fixtures/native-ffi/rust-language-probe) (main)'

      - name: Verify independent C and Rust runtime lifecycle
        run: |
          GERBIL_BUILD_CORES=4 GERBIL_LOADPATH="$PWD/.gerbil/lib:$PWD" \
            gerbil env python3 scripts/test-native-host.py

      - name: Verify language-independent C ABI and ASP performance
        run: |
          GERBIL_LOADPATH="$PWD/.gerbil/lib:$PWD" \
            gerbil env python3 scripts/run-bounded.py --timeout 90 --idle-timeout 5 \
            --log .data/native-language-abi.log --require LANGUAGE-ABI-OK \
            --require LANGUAGE-ABI-100-CALLS \
            -- gxi -e '(load "t/fixtures/tla-sany-differential/preload.ss") (prefer-native-interfaces!) (preload-module "gerbil-parser/t/fixtures/native-ffi/language-v2-probe")' \
            -e '(import :gerbil-parser/t/fixtures/native-ffi/language-v2-probe) (main)'

      - name: Run native Gerbil tests
        timeout-minutes: 15
        run: |
          GERBIL_PATH="$PWD/.gerbil" GERBIL_LOADPATH="$PWD" \
            GAMBOPT=max-heap=1G,debug=q GERBIL_PARSER_LR_TRACE=1 \
            gerbil env gxi t/fixtures/tla-sany-differential/native-suite.ss t languages

      - name: Report GQL native component and actor costs
        run: |
          gerbil env python3 scripts/test-native-local.py \
            --suite gql-profile --suite gql-actors \
            --gerbil-path .gerbil --log-dir .data/gql-diagnostics

      - name: Compare TLA+ candidate structure with pinned SANY
        if: runner.os == 'Linux'
        run: |
          jar="$RUNNER_TEMP/tla2tools-v1.7.4.jar"
          curl --fail --location --retry 3 --silent --show-error \
            --output "$jar" \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          GERBIL_PATH="$PWD/.gerbil" GERBIL_LOADPATH="$PWD" \
            GAMBOPT=max-heap=1G,debug=q GERBIL_PARSER_LR_TRACE=1 \
            gerbil env gxi t/fixtures/tla-sany-differential/watch.ss \
              gerbil env gxi \
              -e '(load "t/fixtures/tla-sany-differential/preload.ss") (preload-module "gerbil-parser/languages/tla-plus/parser")' \
              t/fixtures/tla-sany-differential/compare.ss "$jar"

      - name: Verify complete pinned TLA+ Examples corpus
        if: runner.os == 'Linux'
        run: |
          corpus="$RUNNER_TEMP/tlaplus-examples"
          git init "$corpus"
          git -C "$corpus" remote add origin https://github.com/tlaplus/Examples.git
          git -C "$corpus" fetch --depth=1 origin ceeaa904140e3e03781cb2a79cd6c6d8b8b08e10
          git -C "$corpus" checkout --detach FETCH_HEAD
          GERBIL_PATH="$PWD/.gerbil" GERBIL_LOADPATH="$PWD" \
            GAMBOPT=max-heap=1G,debug=q GERBIL_PARSER_LR_TRACE=1 \
            gerbil env gxi t/fixtures/tla-sany-differential/watch.ss \
              gerbil env gxi \
              -e '(load "t/fixtures/tla-sany-differential/preload.ss") (preload-module "gerbil-parser/languages/tla-plus/parser")' \
              t/fixtures/tla-sany-differential/corpus.ss "$corpus"

      - name: Verify Rust/Rowan AOT generation is current
        run: |
          arithmetic_generated="$(mktemp)"
          gerbil env gxi generate-rust-rowan.ss "$arithmetic_generated"
          rustfmt --edition 2024 "$arithmetic_generated"
          cmp "$arithmetic_generated" rust/gerbil-parser-rowan-arithmetic/src/generated/mod.rs

      - name: Verify Scheme event strategy AOT fixture
        run: |
          event_generated="$(mktemp)"
          grammar_generated="$(mktemp)"
          fold_ir_generated="$(mktemp)"
          outline_ir_generated="$(mktemp)"
          gerbil env gxi t/generate-event-strategy-fixture.ss "$event_generated"
          gerbil env gxi t/generate-event-strategy-grammar.ss "$grammar_generated"
          gerbil env gxi t/generate-event-fold-ir.ss "$fold_ir_generated"
          gerbil env gxi t/generate-outline-fold-ir.ss "$outline_ir_generated"
          rustfmt --edition 2024 "$event_generated" "$grammar_generated"
          cmp "$event_generated" rust/gerbil-parser-rowan/tests/unit/event_strategy_generated.rs
          cmp "$grammar_generated" rust/gerbil-parser-rowan/tests/unit/event_strategy_grammar.rs
          cmp "$fold_ir_generated" t/fixtures/event_fold.ir.json
          cmp "$outline_ir_generated" t/fixtures/outline_fold.ir.json

      - name: Verify Scheme pure owned-string AOT fixture
        run: |
          owned_generated="$(mktemp)"
          gerbil env gxi t/generate-owned-word-fixture.ss "$owned_generated"
          cmp "$owned_generated" rust/gerbil-parser-rowan/tests/unit/owned_first_word_generated.rs

      - name: Verify record assignments Rust/Rowan language pack
        run: |
          fixture="t/fixtures/rowan-record-assignments"
          generated="$(mktemp)"
          clean_home="$RUNNER_TEMP/rowan-aot-home"
          mkdir -p "$clean_home"
          gerbil env gxc \
            "$fixture/languages/records/grammar.ss" \
            "$fixture/languages/records/fixtures.ss" \
            "$fixture/languages/records/parser.ss" \
            "$fixture/languages/records/parser-test.ss"
          env -i \
            HOME="$clean_home" \
            PATH=/usr/bin:/bin \
            GERBIL_PATH="$PWD/.gerbil" \
            GERBIL_PARSER_ROWAN_AOT_LIB="$PWD/.gerbil/lib:$GERBIL_HOME/lib" \
            "$PWD/.gerbil/bin/gerbil-parser-rowan-aot" \
            "$fixture/languages/records/grammar.ss" \
            "$generated"
          rustfmt --edition 2024 "$generated"
          cmp "$generated" "$fixture/src/generated/records.rs"

      - name: Verify native command
        run: |
          gerbil env gparse help
          gerbil env gparse check "1 + 2 * value"
