name: Immutable Gerbil SDK
description: Admit a cached SDK by full digest and platform, using GCC
inputs:
  release-os:
    required: true
    description: release-os
  release-arch:
    required: true
    description: release-arch
  release-tag:
    required: true
    description: release-tag
  release-sha256:
    required: true
    description: release-sha256
runs:
  using: composite
  steps:
    - name: Install Linux system dependencies
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ca-certificates \
          curl \
          git \
          jq \
          libsqlite3-dev \
          libssl-dev \
          openjdk-17-jre-headless \
          openssl \
          pkg-config \
          sqlite3 \
          zlib1g-dev
      shell: bash
    - name: Install macOS system dependencies
      if: runner.os == 'macOS'
      env:
        HOMEBREW_NO_AUTO_UPDATE: 1
        HOMEBREW_NO_INSTALL_CLEANUP: 1
      run: |
        brew list --formula ghostscript >/dev/null 2>&1 && brew unlink ghostscript || true
        brew install coreutils gcc jq openssl pkg-config sqlite zlib
        coreutils_bin="$(brew --prefix coreutils)/libexec/gnubin"
        test -x "$coreutils_bin/timeout"
        echo "$coreutils_bin" >> "$GITHUB_PATH"
        gcc_prefix="$(brew --prefix gcc)"
        gcc_bin="$(
          find "$gcc_prefix/bin" -maxdepth 1 -type f -name 'gcc-[0-9]*' \
            | awk -F- '{print $NF "\t" $0}' \
            | sort -n \
            | tail -n 1 \
            | cut -f2-
        )"
        test -x "$gcc_bin"
        echo "GERBIL_GCC=$gcc_bin" >> "$GITHUB_ENV"
        openssl_prefix="$(brew --prefix openssl@3 2>/dev/null || brew --prefix openssl)"
        sqlite_prefix="$(brew --prefix sqlite)"
        echo "LIBRARY_PATH=$openssl_prefix/lib:$sqlite_prefix/lib${LIBRARY_PATH:+:$LIBRARY_PATH}" >> "$GITHUB_ENV"
        macos_major="$(sw_vers -productVersion | cut -d. -f1)"
        echo "PKG_CONFIG_PATH=$openssl_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
        echo "MACOSX_DEPLOYMENT_TARGET=$macos_major.0" >> "$GITHUB_ENV"
      shell: bash
    - name: Install native task tool
      uses: taiki-e/install-action@f7e5d7c961414b23f5b25b2da9294395d08513ad
      with:
        tool: just
    # The prepared generation binds PATH. macOS runner images carry optional
    # Ruby/Android/etc. entries that vary between independent matrix jobs.
    # Declare the actual CI tool search path before either writer or reader.
    - name: Select reproducible macOS tool search path
      if: runner.os == 'macOS'
      run: |
        ci_path="$HOME/.local/bin:$HOME/.cargo/bin:/opt/homebrew/opt/coreutils/libexec/gnubin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/local/sbin:/usr/bin:/bin:/usr/sbin:/sbin"
        PATH="$ci_path" command -v just
        PATH="$ci_path" command -v timeout
        echo "PATH=$ci_path" >> "$GITHUB_ENV"
      shell: bash
    - name: Cache immutable SDK archive
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      with:
        path: ${{ runner.temp }}/gerbil-sdk.tar.gz
        key: parser-sdk-v1-${{ runner.os }}-${{ runner.arch }}-${{ inputs.release-sha256 }}
    - name: Extract immutable Gerbil host SDK
      run: |
        test -f "$RUNNER_TEMP/gerbil-sdk.tar.gz" || curl --fail --location --retry 3 --output "$RUNNER_TEMP/gerbil-sdk.tar.gz" \
          "https://github.com/tao3k/gerbil-bazel/releases/download/${{ inputs.release-tag }}/${{ inputs.release-tag }}.tar.gz"
        echo '${{ inputs.release-sha256 }}  '"$RUNNER_TEMP/gerbil-sdk.tar.gz" | shasum -a 256 --check
        mkdir -p "$GERBIL_RELEASE_ROOT"
        tar -xzf "$RUNNER_TEMP/gerbil-sdk.tar.gz" -C "$GERBIL_RELEASE_ROOT" --strip-components=1
        GERBIL_HOME="$GERBIL_RELEASE_ROOT/current" \
          GAMBOPT="~~=$GERBIL_RELEASE_ROOT/current,~~bin=$GERBIL_RELEASE_ROOT/current/bin,~~lib=$GERBIL_RELEASE_ROOT/current/lib" \
          "$GERBIL_RELEASE_ROOT/current/bin/gxi" tools/ci/bootstrap.ss \
            "$GERBIL_RELEASE_ROOT" '${{ inputs.release-os }}' '${{ inputs.release-arch }}'
      shell: bash
