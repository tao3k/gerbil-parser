  cpu:
    name: CPU ${{ matrix.lane }}
    if: github.event_name == 'workflow_dispatch' && inputs.release-os == 'linux'
    needs: prepare
    runs-on: ${{ inputs.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lane:
          - scanner
          - events
          - engine
          - ranked
          - utf8
          - tokio
          - module-generation
          - module-preload
    env:
      GERBIL_RELEASE_ROOT: ${{ github.workspace }}/.ci/gerbil-release/${{ inputs.gerbil-label }}
      GERBIL_SDK_SHA256: ${{ inputs.release-sha256 }}
      GERBIL_PREPARED_HEAD: ${{ github.sha }}
      GAMBOPT: max-heap=3G,debug=q
    steps:
      - name: Checkout gerbil-parser
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Activate immutable Gerbil SDK
        uses: ./.github/actions/gerbil-setup
        with:
          release-os: ${{ inputs.release-os }}
          release-arch: ${{ inputs.release-arch }}
          release-tag: ${{ inputs.release-tag }}
          release-sha256: ${{ inputs.release-sha256 }}
      - name: Download exact-head Scheme products
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: scheme-${{ inputs.release-os }}-${{ inputs.release-arch }}-${{ github.sha }}
          path: ${{ runner.temp }}/scheme-products
      - name: Admit prepared Scheme products
        run: bash tools/ci/prepared-products.sh restore "$RUNNER_TEMP/scheme-products/scheme-products.tar.gz"
      - name: Identify Rust toolchain
        id: rust-version
        run: echo "version=$(rustc -Vv | shasum -a 256 | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
        if: matrix.lane == 'tokio'
      - name: Cache Rust FFI consumer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |-
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: parser-ffi-v1-${{ runner.os }}-${{ runner.arch }}-cpu-${{ inputs.release-sha256 }}-${{ steps.rust-version.outputs.version }}-${{ hashFiles('**/Cargo.toml', '**/Cargo.lock') }}
        if: matrix.lane == 'tokio'
      - name: Select an allowed CPU
        run: |-
          allowed=$(awk '/^Cpus_allowed_list:/ {print $2}' /proc/self/status)
          processor=${allowed%%[-,]*}
          test -n "$processor"
          echo "CPU_PROOF_PROCESSOR=$processor" >> "$GITHUB_ENV"
      - name: Prove shared Scheme scanner CPU improvement
        env:
          GAMBOPT: max-heap=3G,debug=q
        run: |
          # Affinity is inherited by each Scheme child; GC and CPU remain charged.
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
            --log .data/scanner-cpu-proof.log --require SCANNER-CPU-PROOF-OK \
            -- gxi t/benchmarks/ranked-literal/cpu-proof.ss bounded 20 2000000
        if: matrix.lane == 'scanner'
      - name: Prove complete 64-record event publication CPU improvement
        env:
          GAMBOPT: max-heap=3G,debug=q
        run: |
          # Affinity is inherited by each Scheme child; GC and CPU remain charged.
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          for unicode in false true; do
            gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
              --log ".data/ffi-event-records-${unicode}-cpu.log" --require ABI-EVENT-CPU-PROOF-OK \
              -- gxi t/benchmarks/language-abi/utf8-proof.ss 20 256 64 records "$unicode" events
          done
        if: matrix.lane == 'events'
      - name: Prove scanner and LR CPU improvement on complete 64-record requests
        env:
          GAMBOPT: max-heap=3G,debug=q
        run: |
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          for unicode in false true; do
            gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
              --log ".data/record-engine-${unicode}-cpu.log" --require ENGINE-CPU-PROOF-OK \
              -- gxi t/benchmarks/language-abi/engine-proof.ss combined "$unicode"
          done
        if: matrix.lane == 'engine'
      - name: Prove complete ranked scanning and public parser CPU improvement
        env:
          GAMBOPT: max-heap=3G,debug=q
        run: |
          # Affinity is inherited by each Scheme child; GC and CPU remain charged.
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
            --log .data/ranked-parser-long-cpu-proof.log --require SCANNER-CPU-PROOF-OK \
            -- gxi t/benchmarks/ranked-literal/cpu-proof.ss parser 20 256 layout 48
          gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
            --log .data/ranked-parser-cpu-proof.log --require SCANNER-CPU-PROOF-OK \
            -- gxi t/benchmarks/ranked-literal/cpu-proof.ss parser 20 1024 layout 12
          for scenario in keyword identifier; do
            gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
              --log ".data/ranked-${scenario}-cpu-proof.log" --require SCANNER-CPU-PROOF-OK \
              -- gxi t/benchmarks/ranked-literal/cpu-proof.ss lexical 20 250000 "$scenario"
          done
          gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
            --log .data/ranked-literal-prefix-cpu-proof.log --require SCANNER-CPU-PROOF-OK \
            -- gxi t/benchmarks/ranked-literal/cpu-proof.ss lexical 20 750000 literal-prefix
        if: matrix.lane == 'ranked'
      - name: Prove upstream FFI UTF-8 complete request CPU improvement
        env:
          GAMBOPT: max-heap=3G,debug=q
        run: |
          # Affinity is inherited by each Scheme child; GC and CPU remain charged.
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          for unicode in false true; do
            gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
              --log ".data/ffi-utf8-${unicode}-cpu.log" --require ABI-UTF8-CPU-PROOF-OK \
              -- gxi t/benchmarks/language-abi/utf8-proof.ss 20 1024 128 identifier "$unicode"
          done
          gerbil env gxi qualify.ss run --timeout 120 --idle-timeout 5 \
            --log .data/ffi-utf8-records-cpu.log --require ABI-UTF8-CPU-REGRESSION-OK \
            -- gxi t/benchmarks/language-abi/utf8-proof.ss 20 256 64 records false regression
        if: matrix.lane == 'utf8'
      - name: Prove complete Rust generation CPU improvement
        if: matrix.lane == 'module-generation'
        run: |
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/module-generation-cpu.log --require MODULE-LOADING-CPU-PROOF-OK \
            -- gxi t/benchmarks/module-loading/benchmark.ss generation
      - name: Prove warm runtime preparation CPU improvement
        if: matrix.lane == 'module-preload'
        run: |
          taskset -pc "$CPU_PROOF_PROCESSOR" "$$"
          gerbil env gxi qualify.ss run --timeout 90 --idle-timeout 5 \
            --log .data/module-preload-cpu.log --require MODULE-LOADING-CPU-PROOF-OK \
            -- gxi t/benchmarks/module-loading/benchmark.ss preload
      - name: Prove Rust Tokio complete 64-record requests
        if: matrix.lane == 'tokio'
        env:
          GERBIL_PARSER_RUST_CPU_PROOF: '1'
          GERBIL_PARSER_NATIVE_HOST_LIBRARY: ${{ github.workspace }}/.gerbil/ci/libparsernative.so
        run: GERBIL_BUILD_CORES=4 GERBIL_LOADPATH="$PWD/.gerbil/lib:$PWD" gerbil env gxi qualify.ss host
      - name: Upload qualification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: logs-${{ inputs.release-os }}-cpu-${{ matrix.lane }}-${{ github.sha }}
          path: .data/**/*.log
          if-no-files-found: ignore
          retention-days: 7
