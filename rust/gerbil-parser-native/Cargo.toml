[package]
name = "gerbil-parser-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Thread-bound Rust ownership for the Gerbil parser language C ABI"

[features]
standalone = []

[dependencies]
gerbil-parser-rowan.workspace = true

# Unsafe code is confined to this FFI crate; the AOT runtime remains forbidden.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
[lints.clippy]
all = "warn"
pedantic = "warn"
